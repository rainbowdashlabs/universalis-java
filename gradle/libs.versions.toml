[versions]
palantir = "2.102.0"
publishdata = "1.4.0"
vanniktech = "0.37.0"
spotless = "8.10.4"
freefair = "9.8.2"
jackson = "3.2.4"
jackson-annotations = "2.22"
annotations = "26.1.0"
slf4j = "2.0.20"
log4j = "2.26.1"
bucket4j = "8.21.0"
httpclient = "5.6.5"
websocket = "2.14"
bson = "5.13.0"
caffeine = "3.3.1"
junit = "6.1.3"
junit-pioneer = "2.3.0"

[libraries]
jackson-databind = { module = "tools.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-annotations = { module = "com.fasterxml.jackson.core:jackson-annotations", version.ref = "jackson-annotations" }
jetbrains-annotations = { module = "org.jetbrains:annotations", version.ref = "annotations" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }
log4j-core = { module = "org.apache.logging.log4j:log4j-core", version.ref = "log4j" }
log4j-slf4j = { module = "org.apache.logging.log4j:log4j-slf4j2-impl", version.ref = "log4j" }
bucket4j = { module = "com.bucket4j:bucket4j_jdk17-core", version.ref = "bucket4j" }
httpclient = { module = "org.apache.httpcomponents.client5:httpclient5", version.ref = "httpclient" }
websocket = { module = "com.neovisionaries:nv-websocket-client", version.ref = "websocket" }
bson = { module = "org.mongodb:bson", version.ref = "bson" }
caffeine = { module = "com.github.ben-manes.caffeine:caffeine", version.ref = "caffeine" }

junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
junit-pioneer = { module = "org.junit-pioneer:junit-pioneer", version.ref = "junit-pioneer" }

# buildSrc classpath only
gradle-publishdata = { module = "de.chojo:publishdata", version.ref = "publishdata" }
gradle-vanniktech = { module = "com.vanniktech:gradle-maven-publish-plugin", version.ref = "vanniktech" }
gradle-spotless = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }

[bundles]
log4j = ["log4j-core", "log4j-slf4j"]

[plugins]
aggregate-javadoc = { id = "io.freefair.aggregate-javadoc", version.ref = "freefair" }
